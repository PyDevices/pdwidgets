name: Publish release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v3
    with:
      build-kind: pure-python
      distribution-name: pydevices-pdwidgets
      import-name: pdwidgets
      install-dependencies: true
      mip-profile: pdwidgets
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit
