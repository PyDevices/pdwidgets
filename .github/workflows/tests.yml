name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PyDevices/pydisplay
          path: pydisplay
          sparse-checkout: |
            src/lib
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: PyDevices/graphics
          path: graphics
          sparse-checkout: |
            lib/graphics
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: PyDevices/palettes
          path: palettes
          sparse-checkout: |
            lib/palettes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check lib tests scripts
      - name: Unit tests
        env:
          PYTHONPATH: lib:tests/stubs:pydisplay/src/lib:graphics/lib:palettes/lib
        run: python -m unittest discover -s tests
