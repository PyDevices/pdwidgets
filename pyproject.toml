[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-pdwidgets"
dynamic = ["version"]
description = "Cross-platform widget toolkit for PyDevices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Brad Barnett", email = "contact@pydevices.com" }]
dependencies = [
  "pydevices-eventsys",
  "pydevices-pygraphics",
  "pydevices-multimer",
  "pydevices-palettes",
]
urls = { Homepage = "https://github.com/PyDevices/pdwidgets", Issues = "https://github.com/PyDevices/pdwidgets/issues" }

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.package-data]
pdwidgets = ["icons/**", "widget-dependencies.md"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
target-version = "py39"
exclude = [
  "lib/pdwidgets/icons/**",
]
lint.select = ["E", "F", "I", "W", "B", "SIM", "PLC0415"]
# SIM105 disabled: contextlib.suppress is not available on MicroPython (matches
# the pydevices-examples ruff config), so try/except/pass is the portable pattern.
lint.ignore = ["E501", "F401", "F403", "F405", "ISC003", "PLC0415", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]

[tool.ruff.lint.isort]
# Keep import sections stable in CI, which checkouts deps as sibling trees
# (pygraphics/, pydevices-examples/, palettes/) that would otherwise become first-party.
known-third-party = ["eventsys", "pygraphics", "multimer", "palettes", "micropython", "png"]
force-sort-within-sections = true
